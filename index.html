<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descargador de YouTube</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #0f0f0f; color: #fff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0;
    }
    .card {
      background: #1c1c1e; padding: 2.5rem;
      border-radius: 16px; width: 90%; max-width: 460px;
    }
    h1 { font-size: 1.3rem; text-align: center; margin-top: 0; }
    input {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid #444; background: #2c2c2e; color: #fff;
      font-size: 1rem;
    }
    .botones { display: flex; gap: 10px; margin-top: 14px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      font-size: 1rem; cursor: pointer; color: #fff;
    }
    #btn-video { background: #e62117; }
    #btn-audio { background: #2e7d32; }
    #estado { text-align: center; margin-top: 14px; min-height: 1.2em; color: #aaa; }
    .aviso { font-size: .75rem; color: #777; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📥 Descargador de YouTube</h1>
    <input id="url" type="url" placeholder="Pega aquí la URL de YouTube…" autofocus>
    <div class="botones">
      <button id="btn-video" onclick="descargar('video')">🎬 Vídeo</button>
      <button id="btn-audio" onclick="descargar('audio')">🎵 Audio</button>
    </div>
    <p id="estado"></p>
    <p class="aviso">Uso personal · Respeta los Términos de Servicio de YouTube</p>
  </div>

  <script>
    const estado = document.getElementById("estado");

    function descargar(modo) {
      const url = document.getElementById("url").value.trim();
      if (!url) {
        estado.textContent = "⚠️ Pega una URL primero.";
        return;
      }
      estado.textContent = "⏳ Descargando… (no cierres la página)";
      window.location.href =
        `/api/descargar?url=${encodeURIComponent(url)}&modo=${modo}`;
      setTimeout(() => {
        estado.textContent = "Si no empezó la descarga, revisa la URL.";
      }, 3000);
    }

    document.getElementById("url").addEventListener("keydown", e => {
      if (e.key === "Enter") descargar("video");
    });
  </script>
</body>
</html>
