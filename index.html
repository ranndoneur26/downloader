<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargador de YouTube</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --video: #ef4444;
      --audio: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: var(--text);
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 1.7rem;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      outline: none;
      background: #111827;
      color: var(--text);
      font-size: 1rem;
    }

    input:focus {
      border-color: #60a5fa;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .video {
      background: var(--video);
    }

    .audio {
      background: var(--audio);
    }

    #status {
      min-height: 24px;
      margin: 18px 0 0;
      text-align: center;
      color: var(--muted);
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      main {
        padding: 24px 18px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>📥 Descargador de YouTube</h1>
    <p class="description">Introduce la URL del vídeo y elige el formato.</p>

    <form id="downloadForm">
      <label for="url">URL del vídeo</label>
      <input
        id="url"
        name="url"
        type="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required
      >

      <div class="buttons">
        <button class="video" type="submit" data-format="video">
          🎬 Descargar vídeo
        </button>
        <button class="audio" type="submit" data-format="audio">
          🎵 Descargar audio
        </button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      Uso personal · Respeta los Términos de Servicio de YouTube y los derechos de autor.
    </footer>
  </main>

  <script>
    const form = document.getElementById("downloadForm");
    const urlInput = document.getElementById("url");
    const status = document.getElementById("status");
    const buttons = document.querySelectorAll("button[type='submit']");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitter = event.submitter;
      const format = submitter.dataset.format;
      const url = urlInput.value.trim();

      if (!url) {
        status.textContent = "Introduce una URL válida.";
        return;
      }

      buttons.forEach((button) => {
        button.disabled = true;
      });

      status.textContent = "Preparando la descarga...";

      try {
        const endpoint = format === "audio"
          ? "/download/audio"
          : "/download/video";

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "No se pudo procesar el vídeo.");
        }

        const blob = await response.blob();
        const contentDisposition = response.headers.get("Content-Disposition") || "";
        const filenameMatch = contentDisposition.match(/filename="?([^"]+)"?/i);
        const filename = filenameMatch
          ? filenameMatch[1]
          : `descarga.${format === "audio" ? "mp3" : "mp4"}`;

        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = downloadUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(downloadUrl);
        status.textContent = "Descarga iniciada correctamente.";
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      } finally {
        buttons.forEach((button) => {
          button.disabled = false;
        });
      }
    });
  </script>
</body>
</html>
